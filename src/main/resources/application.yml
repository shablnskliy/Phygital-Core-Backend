server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: Phygital-Core

  # --- НАСТРОЙКИ ДЛЯ POSTGRESQL ---
  datasource:
    url: jdbc:postgresql://localhost:5432/phygital_db
    username: postgres
    password: 1234 # <-- Твой пароль от pgAdmin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
